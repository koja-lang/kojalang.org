title: Koja
brand: The Koja programming language
tagline: Joy, compiled.
description: Koja is a programming language to spark joy. Statically typed, compiled to native binaries, with friendly syntax and effortless concurrency. Now in alpha.
url: https://kojalang.org
lang: en
author: Henry Popp

twitter:
  card: summary_large_image

collections:
  releases:
    output: true
    permalink: /changelog/:title/

defaults:
  - scope:
      path: ""
    values:
      image: /static/og-image.png
  - scope:
      path: ""
      type: releases
    values:
      layout: docs
      render_with_liquid: false
      description: Release notes for the Koja programming language.

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - og-image.html
  - vendor
  - .github
