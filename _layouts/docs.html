---
layout: default
---

<div class="docs">
  <aside class="docs-sidebar">
    <button
      class="docs-toc-toggle"
      type="button"
      aria-controls="docs-toc"
      aria-expanded="false"
    >
      On this page
      <svg
        aria-hidden="true"
        focusable="false"
        viewBox="0 0 24 24"
        width="16"
        height="16"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m6 9 6 6 6-6" />
      </svg>
    </button>
    <nav
      class="docs-toc"
      id="docs-toc"
      aria-label="Table of contents"
      data-depth="{{ page.toc_depth | default: 3 }}"
    >
      <p class="docs-toc-title">On this page</p>
    </nav>
  </aside>
  <article class="docs-content">
    <header class="docs-header">
      <h1>{{ page.title }}</h1>
      <p class="docs-meta">
        Current as of Koja v{{ page.koja_version }} ·
        <a href="{{ page.source_url }}">Source on GitHub</a>
      </p>
    </header>
    {{ content }}
  </article>
</div>
